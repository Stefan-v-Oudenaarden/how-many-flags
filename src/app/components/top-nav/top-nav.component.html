<nav
  class="bg-linear-to-r from-slate-50 to-slate-100 border-b border-slate-200 shadow-sm sticky top-0 z-99 backdrop-opacity-95 backdrop-blur-xs"
>
  <div class="mx-auto sm:px-2 w-full">
    <div class="flex items-center justify-between h-12">
      <!-- Start Slot -->
      <div class="flex items-center gap-4">
        <ng-content select="[slot='start']" />

        <a [routerLink]="['/home']" class="items-center gap-3 flex">
          <div
            class="w-10 h-10 bg-linear-to-br from-amber-300 to-red-600 rounded-full flex items-center justify-center shadow-md"
          >
            <img src="icons/flag-sharp.svg" class="w-4 h-4" />
          </div>
          <span class="text-xl font-bold text-slate-800 hidden sm:block">How Many Flags</span>
        </a>
      </div>

      <!-- Middle Slot -->
      <div class="hidden sm:flex items-center gap-6">
        <ng-content select="[slot='middle']" />

        @for (item of navItems(); track item.label) {
        <a
          [class.text-blue-600]="activeItem() === item.label"
          [class.font-semibold]="activeItem() === item.label"
          class="text-slate-600 hover:text-blue-600 transition-colors px-3 py-2 rounded-lg hover:bg-slate-200/50"
          [routerLink]="item.url"
        >
          {{ item.label }}
        </a>
        }
      </div>

      <!-- End Slot -->
      <div class="flex items-center gap-3">
        <ng-content select="[slot='end']" />
        <a
          class="sm:hidden w-10 h-10 flex items-center justify-center cursor-pointer hover:shadow-lg transition-shadow"
          (click)="openMobileNavigation()"
        >
          <ng-icon hlm name="lucideMenuSquare" size="1.5rem" />
        </a>

        <a href="https://github.com/Stefan-v-Oudenaarden" target="_blank">
          <div
            class="w-10 h-10 rounded-full items-center justify-center shadow-md cursor-pointer hover:shadow-lg transition-shadow bg-white hidden sm:flex"
          >
            <ng-icon hlm name="lucideGithub" size="1.5rem" />
          </div>
        </a>
      </div>
    </div>
  </div>
</nav>
@if (isMobileMenuOpen()) {
<div
  class="fixed inset-0 bg-slate-200 opacity-50 z-50 h-full w-full block sm:hidden"
  (click)="closeMobileNavigation()"
></div>
<div class="fixed top-8 left-0 right-0 bg-white shadow-lg z-51 p-4 block sm:hidden">
  <div class="flex flex-col space-y-3">
    @for (item of navItems(); track item.label) {
    <a
      [routerLink]="item.url"
      class="py-2 text-slate-800 hover:text-blue-600"
      (click)="closeMobileNavigation()"
    >
      {{ item.label }}
    </a>
    }
  </div>
</div>
}
